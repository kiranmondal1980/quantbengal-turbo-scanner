name: QuantBengal Turbo-Scanner Engine

on:
  workflow_dispatch: # Allows manual trigger from the UI
  schedule:
    - cron: '0 */6 * * *' # Runs at minute 0 past every 6th hour

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    
    # Prevents multiple instances from running concurrently
    concurrency:
      group: turbo-scanner
      cancel-in-progress: true 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up boot times by caching requirements

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Turbo-Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python turbo_scanner.py
